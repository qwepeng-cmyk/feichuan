{template "header.html"}
<div class="note note-danger" >
    <p>单个语言独立表存储，已创建的表不会重复创建，可以放心执行</p>
</div>
<form action="" class="form-horizontal" method="post" name="myform" id="myform">
    {$form}
    <div class="portlet bordered light myfbody">
        <div class="portlet-body">
            <div class="form-body">


                <div class="form-group">
                    <label class="col-md-2 control-label">执行日志</label>
                    <div class="col-md-9">
                        <div id="logList" class="well" style="max-height: 120px; overflow-y: auto;">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="col-md-2 control-label">执行拆分</label>
                    <div class="col-md-9">
                        <button type="button" onclick="dr_test2()" class="btn btn-primary tooltips" data-original-title="旧版本才需执行分表" id="startBtn">
                            <i class="fa fa-play"></i> 开始拆分
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="col-md-2 control-label">执行进度</label>
                    <div class="col-md-9">
                        <div id="progressList">
                            <!-- 进度条将在这里动态添加 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>

<script type="text/javascript">
var progressCheckers = {};
var processedLanguages = new Set();
var currentProcessing = null;
var lastLogMessage = '';
var processingLanguages = new Set(); // 跟踪正在处理的语言

// 添加日志
function addLog(message, type) {
    // 如果是相同的消息，不重复添加
    if (message === lastLogMessage) {
        return;
    }
    
    // 如果是开始处理的消息，检查是否已经在处理
    if (message.startsWith('开始处理语言：')) {
        var lang = message.split('：')[1];
        if (processingLanguages.has(lang)) {
            return;
        }
        processingLanguages.add(lang);
    }
    
    // 如果是完成消息，从处理集合中移除
    if (message.includes('迁移完成') || message.includes('没有需要迁移的数据')) {
        var lang = message.split(' ')[0];
        processingLanguages.delete(lang);
    }
    
    lastLogMessage = message;
    
    var className = 'text-default';
    if (type === 'error') className = 'text-danger';
    if (type === 'success') className = 'text-success';
    
    var time = new Date().toLocaleTimeString();
    $("#logList").prepend('<div class="' + className + '">[' + time + '] ' + message + '</div>');
}

// 创建进度条
function createProgressBar(code) {
    if ($(`#progress-${code}`).length) return;
    
    var progressHtml = `
        <div class="progress-item" id="progress-${code}" style="margin-bottom: 15px;">
            <div class="progress-header" style="margin-bottom: 5px;">
                <span class="badge badge-info">${code}</span>
                <span class="progress-status">准备开始...</span>
            </div>
            <div class="progress" style="margin-bottom: 5px; height: 20px;">
                <div class="progress-bar progress-bar-striped active" role="progressbar" style="width: 0%">
                    <span>0%</span>
                </div>
            </div>
        </div>
    `;
    $("#progressList").append(progressHtml);
}

// 更新进度条
function updateProgressBar(code, progress, status) {
    if (!code) return;
    
    var $progressItem = $(`#progress-${code}`);
    if (!$progressItem.length) {
        createProgressBar(code);
        $progressItem = $(`#progress-${code}`);
    }

    var $progressBar = $progressItem.find('.progress-bar');
    var $status = $progressItem.find('.progress-status');
    
    // 如果已经完成，不再更新
    if (processedLanguages.has(code)) {
        return;
    }

    if (status === 'no_data') {
        $progressBar
            .css('width', '100%')
            .removeClass('active')
            .addClass('progress-bar-info')
            .find('span').text('100%');
        $status.text('没有需要迁移的数据');
        $progressItem.find('.badge').removeClass('badge-info').addClass('badge-info');
        processedLanguages.add(code);
        continueProcessing();
        return;
    }
    
    if (status === 'complete') {
        $progressBar
            .css('width', '100%')
            .removeClass('active')
            .addClass('progress-bar-success')
            .find('span').text('100%');
        $status.text('迁移完成');
        $progressItem.find('.badge').removeClass('badge-info').addClass('badge-success');
        processedLanguages.add(code);
        continueProcessing();
        return;
    }
    
    // 正常进度更新
    if (progress) {
        var percent = progress.percent || 0;
        $progressBar
            .css('width', percent + '%')
            .find('span').text(percent + '%');
        
        if (progress.total > 0) {
            $status.text(`已处理: ${progress.processed} / ${progress.total}`);
        }
        
        // 如果完成
        if (percent >= 100) {
            updateProgressBar(code, null, 'complete');
        } else {
            // 如果未完成，继续处理当前语言
            continueLanguageProcessing(code);
        }
    }
}

// 继续处理当前语言
function continueLanguageProcessing(code) {
    if (!code || processedLanguages.has(code)) return;
    
    currentProcessing = code;
    $.ajax({
        type: "GET",
        url: "{dr_url('synlang/split/split_table')}&code=" + code,
        dataType: "json",
        success: function(json) {
            if (json.code == 0) {
                addLog(json.msg, 'error');
                currentProcessing = null;
                continueProcessing();
            } else if (json.code == 1) {
                if (json.msg.includes('没有需要迁移的数据')) {
                    updateProgressBar(code, null, 'no_data');
                    addLog(code + ' 没有需要迁移的数据', 'info');
                    if (json.data && json.data.next !== undefined) {
                        setTimeout(function() {
                            split_next(json.data.next);
                        }, 100);
                    }
                } else if (json.msg.includes('已完成')) {
                    updateProgressBar(code, json.data.progress, 'complete');
                    addLog(code + ' 迁移完成', 'success');
                    if (json.data && json.data.next !== undefined) {
                        setTimeout(function() {
                            split_next(json.data.next);
                        }, 100);
                    }
                } else {
                    updateProgressBar(code, json.data.progress);
                    if (json.data.progress && json.data.progress.percent < 100) {
                        setTimeout(function() {
                            continueLanguageProcessing(code);
                        }, 100);
                    }
                }
            }
        },
        error: function(xhr, type) {
            addLog('处理失败: ' + type, 'error');
            setTimeout(function() {
                continueLanguageProcessing(code);
            }, 1000);
        }
    });
}

// 继续处理下一个语言
function continueProcessing() {
    currentProcessing = null;
    split_next(0);
}

// 清理所有进度检查器
function clearAllProgressCheckers() {
    Object.keys(progressCheckers).forEach(function(code) {
        clearTimeout(progressCheckers[code]);
        delete progressCheckers[code];
    });
    processedLanguages.clear();
    currentProcessing = null;
}

// 处理下一个语言
function split_next(step) {
    if (currentProcessing) return; // 如果有正在处理的语言，等待其完成
    
    $.ajax({
        type: "GET",
        url: "{dr_url('synlang/split/split_table')}&step=" + step,
        dataType: "json",
        success: function(json) {
            if (json.code == 0) {
                addLog(json.msg, 'error');
                $("#startBtn").prop('disabled', false);
            } else if (json.code == 1) {
                if (json.data && json.data.code && !processedLanguages.has(json.data.code)) {
                    addLog('开始处理语言：' + json.data.code, 'info');
                }
                
                if (json.data && json.data.code) {
                    if (json.msg.includes('没有需要迁移的数据')) {
                        updateProgressBar(json.data.code, null, 'no_data');
                        addLog(json.data.code + ' 没有需要迁移的数据', 'info');
                        if (json.data.next !== undefined) {
                            setTimeout(function() {
                                split_next(json.data.next);
                            }, 100);
                        }
                    } else {
                        continueLanguageProcessing(json.data.code);
                    }
                }
            } else if (json.code == 2) {
                addLog('全部语言处理完成', 'success');
                $("#startBtn").prop('disabled', false);
            }
        },
        error: function(xhr, type) {
            addLog('请求失败: ' + type, 'error');
            $("#startBtn").prop('disabled', false);
        }
    });
}

function dr_test2() {
    // 禁用开始按钮
    $("#startBtn").prop('disabled', true);
    
    // 清空进度列表和日志
    $("#progressList").empty();
    $("#logList").empty();
    
    // 清理之前的进度检查器
    clearAllProgressCheckers();
    
    addLog('开始执行分表操作...', 'info');
    
    // 开始处理第一个语言
    split_next(0);
}
</script>

<style>
.progress {
    margin-bottom: 10px;
    background-color: #f5f5f5;
    border-radius: 4px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.1);
    overflow: hidden;
}
.progress-bar {
    float: left;
    width: 0;
    height: 100%;
    font-size: 12px;
    line-height: 20px;
    color: #fff;
    text-align: center;
    background-color: #337ab7;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.15);
    transition: width .6s ease;
    min-width: 2%;
}
.progress-bar-striped {
    background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
    background-size: 40px 40px;
    animation: progress-bar-stripes 2s linear infinite;
}
.progress-bar-success {
    background-color: #5cb85c;
}
.progress-bar-info {
    background-color: #5bc0de;
}
@keyframes progress-bar-stripes {
    from { background-position: 40px 0; }
    to { background-position: 0 0; }
}

.badge {
    display: inline-block;
    min-width: 10px;
    padding: 3px 7px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    white-space: nowrap;
    vertical-align: middle;
    border-radius: 10px;
}
.badge-info {
    background-color: #5bc0de;
}
.badge-success {
    background-color: #5cb85c;
}

#logList {
    background: #f9f9f9;
    border: 1px solid #ddd;
    padding: 10px;
    font-family: monospace;
    max-height: 300px;
    overflow-y: auto;
}
#logList div {
    margin-bottom: 5px;
    border-bottom: 1px solid #eee;
    padding-bottom: 3px;
}
</style>

{template "footer.html"}
