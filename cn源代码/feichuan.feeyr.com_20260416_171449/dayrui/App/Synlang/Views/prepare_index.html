{template "header.html"}

<div class="row">
    <div class="col-md-6">
        <div class="portlet light bordered">
            <div class="portlet-title">
                <div class="caption">
                    <span class="caption-subject font-green-sharp bold uppercase">预翻译管理</span>
                </div>
            </div>
            <div class="portlet-body">
                <form action="" class="form-horizontal" method="post" name="myform" id="myform">
                    <div class="form-body">
                        <!-- 操作方式选择 -->
                        <div class="form-group">
                            <label class="col-md-2 control-label">操作方式</label>
                            <div class="col-md-9">
                                <div class="mt-radio-inline">
                                    <label class="mt-radio">
                                        <input type="radio" name="operation_mode" value="site"> 按站点选择
                                        <span></span>
                                    </label>
                                    <label class="mt-radio">
                                        <input type="radio" name="operation_mode" value="manual" > 手动录入URL
                                        <span></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <div class="form-group" id="site-selection-group" style="display: none;">
                            <label class="col-md-2 control-label">语言站点</label>
                            <div class="col-md-9">
                                <div class="input-group" style="width:350px">
                                    <select name="data[site]" class="form-control">
                                        <option value=""> == 选择站点 == </option>
                                        {loop $synloop $t}
                                        <option value="{$t.url}">{$t.name} （{$t.url}）</option>
                                        {/loop}
                                    </select>
                                    <span class="input-group-btn">
                                        <button type="button" class="btn green" id="get-site-urls-btn">
                                            <i class="fa fa-arrow-right fa-fw"></i> 加载URL
                                        </button>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="form-group" id="site-selection-group-list" style="display: none;">
                            <label class="col-md-2 control-label">每个模块</label>
                            <div class="col-md-9">
                                <label style="width:100px"><input type="text" name="data[num]" class="form-control"
                                        value="10" /></label> 条
                                <span class="help-block">不需要全翻译，大部分数据是可复用的</span>
                            </div>
                        </div>
                        <div class="form-group" id="site-selection-group-area" style="display: none;">
                            <label class="col-md-2 control-label">URL列表</label>
                            <div class="col-md-9">
                                <textarea name="data[urls]" class="form-control" rows="15"
                                    placeholder="请输入需要预翻译的URL，每行一个">{$urls}</textarea>
                                <span class="help-block">请输入需要预翻译的URL，每行一个URL</span>
                            </div>
                        </div>
                        <!-- 显示控制选项 -->
                        <div class="form-group">
                            <label class="col-md-2 control-label"></label>
                            <div class="col-md-9">
                                <div class="note note-warning">
                                    温馨提示：操作消耗翻译资源，建议先确认其他配置已经达标，最后再执行
                                </div>
                                <button type="button" class="btn dark" id="submit-btn">开始预翻译</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="portlet light bordered">
            <div class="portlet-title">
                <div class="caption">
                    <span class="caption-subject font-green-sharp bold uppercase">预翻译结果</span>
                </div>



                <div class="actions">
                    <div class="input-group" id="summary-info"></div>
                </div>



            </div>
            <div class="portlet-body" style="margin-top:0">
                <div class="form-body">
                    <!-- 结果显示区域 -->
                    <div id="translation-results" style="margin-top: 20px; display: none;">

                        <!-- 统一结果显示区域 -->
                        <div id="unified-results" style="display: none;">
                            <div class="row">

                                <div class="table-responsive" style="max-height: 575px; overflow-y: auto;">
                                    <table class="table table-striped table-bordered table-hover">
                                        <thead>
                                            <tr>
                                                <th width="10%">状态</th>
                                                <th>URL</th>
                                                <th width="10%">状态码</th>
                                                <th width="10%">时间</th>
                                                <th width="15%">消息</th>
                                            </tr>
                                        </thead>
                                        <tbody id="results-table-body">
                                        </tbody>
                                    </table>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    $(function () {
        // 操作方式切换
        $('input[name="operation_mode"]').change(function () {
            if ($(this).val() === 'site') {
                $('#site-selection-group').show();
                $('#site-selection-group-list').show();
                $('#site-selection-group-area').show();
                $('#get-site-urls-btn').show();
            } else {
                $('#site-selection-group-area').show();
                $('#site-selection-group').hide();
                $('#site-selection-group-list').hide();
                $('#get-site-urls-btn').hide();
            }
        });

        // 获取站点URL
        $('#get-site-urls-btn').click(function () {
            var siteDir = $('select[name="data[site]"]').val();
            var num = $('input[name="data[num]"]').val();
            if (!siteDir) {
                dr_tips(0, '请选择一个站点');
                return false;
            }

            $(this).attr('disabled', true).text('正在获取...');

            $.ajax({
                type: "POST",
                dataType: "json",
                url: "{dr_url('synlang/prepare/getSiteUrls')}",
                data: {          // 再包一层
                    data: {
                        domain: siteDir,
                        num: num
                    }
                },
                success: function (json) {
                    $('#get-site-urls-btn').attr('disabled', false).text('获取站点URL');
                    if (json.code) {
                        var urls = json.data.urls.join("\n");
                        $('textarea[name="data[urls]"]').val(urls);
                        dr_tips(1, '已获取 ' + json.data.urls.length + ' 个URL');
                    } else {
                        dr_tips(0, json.msg);
                    }
                },
                error: function (HttpRequest, ajaxOptions, thrownError) {
                    $('#get-site-urls-btn').attr('disabled', false).text('获取站点URL');
                    dr_tips(0, '请求失败，请重试');
                }
            });
        });

        // 提交预翻译任务
        $('#submit-btn').click(function () {
            var urls = $('textarea[name="data[urls]"]').val();
            if (!urls.trim()) {
                dr_tips(0, '请输入需要预翻译的URL');
                return false;
            }

            $('#submit-btn').attr('disabled', true).text('正在处理...');

            // 将URL列表分割为数组
            var urlArray = urls.split('\n').filter(function (url) { return url.trim() !== ''; });
            var totalUrls = urlArray.length;
            var processedUrls = 0;
            var successCount = 0;
            var failedCount = 0;

            // 清空之前的结果
            $('#results-table-body').empty();
            $('#success-results-body').empty();
            $('#failed-results-body').empty();

            // 显示结果区域
            $('#translation-results').show();
            $('#unified-results').show();
            $('#separated-results').hide();

            // 更新摘要信息
            function updateSummary() {
                var summaryInfo = '总计 <button type="button" class="btn btn-xs ">' + totalUrls + '</button> 个URL ' +
                    '已处理 <button type="button" class="btn btn-xs ">' + processedUrls + '</button>&nbsp&nbsp' +
                    '成功 <button type="button" class="btn btn-xs green">' + successCount + '</button>&nbsp&nbsp' +
                    '失败 <button type="button" class="btn btn-xs red">' + failedCount + '</button>';
                $('#summary-info').html(summaryInfo);
            }

            // 处理单个URL
            function processUrl(index) {
                if (index >= urlArray.length) {
                    // 所有URL处理完成
                    $('#submit-btn').attr('disabled', false).text('开始预翻译');
                    dr_tips(1, '预翻译任务完成！');
                    return;
                }

                var url = urlArray[index].trim();
                if (!url) {
                    processUrl(index + 1);
                    return;
                }

                // 发送单个URL进行处理
                $.ajax({
                    type: "POST",
                    dataType: "json",
                    url: "{dr_url('synlang/prepare/index',['time'=>SYS_TIME])}",
                    data: {
                        'data[single_url]': url
                    },
                    success: function (json) {
                        processedUrls++;
                        if (json.code && json.data.detail) {
                            var item = json.data.detail;
                            var responseTime = item.response_time ? item.response_time.toFixed(2) + '秒' : 'N/A';

                            if (json.data.success) {
                                successCount++;
                                var status = '<span class="label label-success">成功</span>';
                            } else {
                                failedCount++;
                                var status = '<span class="label label-danger">失败</span>';
                            }

                            // 添加到结果表格（最新结果插入到第一行）
                            var row = '<tr>' +
                                '<td>' + status + '</td>' +
                                '<td><a href="' + item.url + '" target="_blank">' + item.url + '</a></td>' +
                                '<td>' + item.http_code + '</td>' +
                                '<td>' + responseTime + '</td>' +
                                '<td>' + item.message + '</td>' +
                                '</tr>';
                            $('#results-table-body').prepend(row);



                        }

                        updateSummary();
                        processUrl(index + 1);
                    },
                    error: function (HttpRequest, ajaxOptions, thrownError) {
                        processedUrls++;
                        failedCount++;

                        // 添加失败记录到结果表格（最新结果插入到第一行）
                        var row = '<tr>' +
                            '<td><span class="label label-danger">失败</span></td>' +
                            '<td>' + url + '</td>' +
                            '<td>N/A</td>' +
                            '<td>N/A</td>' +
                            '<td>请求失败</td>' +
                            '</tr>';
                        $('#results-table-body').prepend(row);

                        updateSummary();
                        processUrl(index + 1);
                    }
                });
            }

            // 开始处理URL
            updateSummary();
            processUrl(0);
        });
    });
</script>

{template "footer.html"}
